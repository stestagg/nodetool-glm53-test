[package]
name = "nodetool"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1_smol = "1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "net", "io-util", "macros"] }
uuid = { version = "1", default-features = false, features = ["std", "serde", "v4"] }

[dev-dependencies]
serde_json = "1"
test-plugin-alpha = { path = "tests/plugins/alpha" }
test-plugin-beta = { path = "tests/plugins/beta" }
test-plugin-gamma = { path = "tests/plugins/gamma" }
test-plugin-delta = { path = "tests/plugins/delta" }
test-plugin-epsilon = { path = "tests/plugins/epsilon" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
