[package]
name = "nodetool-fizzbuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
nodetool = { path = "../nodetool" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "net", "signal"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
